<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro LMC Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Viewport Frame */
    #viewport {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Top Controls Overlay */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .icon-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Sliding Color Grading Panel */
    .grading-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(15px);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 15;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .grading-panel.open {
      transform: translateY(0);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
      color: #ddd;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    /* Bottom Shutter Controls */
    .bottom-bar {
      height: 110px;
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    #capture-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    #capture-btn:active {
      transform: scale(0.92);
    }
    .shutter-inner {
      width: 58px;
      height: 58px;
      background: #fff;
      border-radius: 50%;
    }
    .thumb-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: #111;
    }
    #gallery-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas { display: none; }
  </style>
</head>
<body>

  <div id="viewport">
    <div class="top-bar">
      <button class="icon-btn" id="switch-btn">🔄 ক্যামেরা ঘোরান</button>
      <button class="icon-btn" id="toggle-grading-btn">🎨 কালার গ্রেডিং</button>
    </div>

    <video id="video" autoplay playsinline></video>

    <!-- Hidden Color Grading Panel -->
    <div class="grading-panel" id="grading-panel">
      <div class="panel-header">
        <span>কালার অ্যাডজাস্টমেন্ট</span>
        <span style="cursor:pointer;" id="close-panel-btn">✕</span>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>ব্রাইটনেস (Brightness)</span>
          <span id="brightness-val">100%</span>
        </div>
        <input type="range" id="brightness" min="50" max="150" value="100">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>কন্ট্রাস্ট (Contrast)</span>
          <span id="contrast-val">100%</span>
        </div>
        <input type="range" id="contrast" min="50" max="150" value="100">
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>স্যাচুরেশন (Saturation)</span>
          <span id="saturation-val">100%</span>
        </div>
        <input type="range" id="saturation" min="0" max="200" value="100">
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="thumb-wrapper">
      <img id="gallery-thumb" alt="">
    </div>
    <div id="capture-btn">
      <div class="shutter-inner"></div>
    </div>
    <div style="width: 48px;"></div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('capture-btn');
    const switchBtn = document.getElementById('switch-btn');
    const toggleGradingBtn = document.getElementById('toggle-grading-btn');
    const closePanelBtn = document.getElementById('close-panel-btn');
    const gradingPanel = document.getElementById('grading-panel');
    const galleryThumb = document.getElementById('gallery-thumb');

    const brightnessInput = document.getElementById('brightness');
    const contrastInput = document.getElementById('contrast');
    const saturationInput = document.getElementById('saturation');

    let currentStream = null;
    let useFrontCamera = false;

    // Toggle Panel
    toggleGradingBtn.addEventListener('click', () => {
      gradingPanel.classList.toggle('open');
    });
    closePanelBtn.addEventListener('click', () => {
      gradingPanel.classList.remove('open');
    });

    // Apply Filters Live
    function applyFilter() {
      document.getElementById('brightness-val').innerText = brightnessInput.value + '%';
      document.getElementById('contrast-val').innerText = contrastInput.value + '%';
      document.getElementById('saturation-val').innerText = saturationInput.value + '%';

      const filterStr = `brightness(${brightnessInput.value}%) contrast(${contrastInput.value}%) saturate(${saturationInput.value}%)`;
      video.style.filter = filterStr;
    }

    [brightnessInput, contrastInput, saturationInput].forEach(input => {
      input.addEventListener('input', applyFilter);
    });

    // Start Camera
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: useFrontCamera ? "user" : "environment"
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        console.error("Camera access error:", err);
        alert("ক্যামেরা অন করতে সমস্যা হচ্ছে। নিশ্চিত করুন সাইটটি HTTPS-এ চলছে।");
      }
    }

    switchBtn.addEventListener('click', () => {
      useFrontCamera = !useFrontCamera;
      startCamera();
    });

    // Capture Image with Color Filters
    captureBtn.addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      ctx.filter = video.style.filter || "none";
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL('image/png');
      galleryThumb.src = dataUrl;
    });

    startCamera();
  </script>
</body>
</html>
